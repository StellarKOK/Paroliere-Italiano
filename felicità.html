<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <title>Paroliere Italiano</title>
  <style>
    .glass-text {
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>

<body
  class="w-full min-h-screen flex flex-row justify-center items-center bg-gradient-to-br from-emerald-400 to-emerald-900 p-4">

  <!-- DEL GIORNO -->
  <div class="flex flex-col gap-y-3">

  </div>

  <!-- RANDOMIZZATORE -->
  <div
    class="w-full max-w-md sm:max-w-lg md:max-w-2xl flex flex-col gap-y-6 sm:gap-y-8 justify-center items-center bg-white/10 backdrop-blur-md px-6 py-8 sm:px-10 sm:py-10 md:px-12 rounded-3xl shadow-2xl border border-white/20 transition-all duration-300">

    <h1
      class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight glass-text text-center transition-all duration-300">
      Bestemmiatore
    </h1>

    <div
      class="w-full flex flex-col sm:flex-row gap-y-3 sm:gap-y-0 items-center justify-center gap-x-4 transition-all duration-300">
      <h2 id="soggetto"
        class="w-full sm:w-auto text-2xl sm:text-3xl md:text-4xl font-semibold text-white bg-black/20 px-4 py-3 sm:px-6 rounded-xl sm:min-w-[160px] text-center transition-all duration-300">
        Benvenuto
      </h2>
      <h2 id="elemento"
        class="w-full sm:w-auto text-2xl sm:text-3xl md:text-4xl font-semibold text-white bg-black/20 px-4 py-3 sm:px-6 rounded-xl sm:min-w-[160px] text-center transition-all duration-300">
        Bestemmiatore
      </h2>
    </div>

    <button type="button" onclick="randomizza()"
      class="bg-white text-emerald-800 font-bold text-base sm:text-lg px-6 py-3 sm:px-8 rounded-lg shadow-md hover:bg-emerald-100 hover:scale-105 active:scale-95 transition-all duration-200">
      Randomizza
    </button>

  </div>

    function randomizza() {
      const soggettoScelto = soggetti[Math.floor(Math.random() * soggetti.length)];
      const elementoScelto = elementi[Math.floor(Math.random() * elementi.length)];

      document.getElementById("soggetto").textContent = soggettoScelto;
      document.getElementById("elemento").textContent = elementoScelto;
    }
  </script>
</body>

</html>
